version: '3.8'

services:
  # Development service with hot reload
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: openacm-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host
    stdin_open: true
    tty: true

  # Production service (nginx)
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openacm-prod
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production